[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fastvideo3"
version = "0.1.0"
description = "FastVideo3 —— 基于 LangGraph 多智能体的全 API 化短剧视频生成教学平台"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "tenacity>=8.3",
    "typer>=0.12",
    "rich>=13.7",
    "pillow>=10.3",
    "imageio-ffmpeg>=0.5",
    "sqlalchemy>=2.0",
    "aiosqlite>=0.20",
    "langgraph>=1.0",
    "langgraph-checkpoint-sqlite>=2.0",
    "edge-tts>=7.0",
    "dashscope>=1.20",
]

[project.optional-dependencies]
# 完整教学环境: 本地 CPU 组件(双人同屏) + Web 面板。torch 必须先装 CPU 版:
#   pip install torch --index-url https://download.pytorch.org/whl/cpu
full = [
    "ultralytics>=8.2",
    "rembg[cpu]>=2.0",
    "streamlit>=1.37",
    "librosa>=0.10",
    "soundfile>=0.12",
]
postgres = ["psycopg[binary]>=3.1", "langgraph-checkpoint-postgres>=2.0"]
web = [
    "fastapi>=0.111",
    "uvicorn>=0.30",
]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "respx>=0.21",
    "fastapi>=0.111",
    "uvicorn>=0.30",
]

[project.scripts]
fastvideo3 = "fastvideo3.app.cli:app_entry"

[tool.setuptools.packages.find]
include = ["fastvideo3*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
ignore = ["E731"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = false
disallow_untyped_defs = false
warn_unused_ignores = false
exclude = ["tests/", "build/", ".venv/"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "api: 需要真实 API KEY 的冒烟测试 (nightly)",
]
filterwarnings = ["ignore::DeprecationWarning"]
