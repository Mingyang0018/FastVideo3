# 720P 交付档（`--resolution 720P` / `FV3_RESOLUTION=720P`）：深度合并覆盖 default.yaml。
# 选型原则：同预算内优先保"全片一致性 + 分辨率 + 运动质量"三大观感项。
# 成本量级（90 秒片）：文生图 wan2.7-image 约 21 张 ≈ ¥4 + wan3.0 场景片段 720P ¥0.6/秒
# 约 80s ≈ ¥50 —— 与 480P 差在分辨率，与 1080P 差在单价（¥1.2/秒）。
# ⚠ 这里**不写文生图**：三档共用 default.yaml 那一条（2026-10-17 定，理由见那个文件）。
providers:
  # 口型恒由 wan3.0 场景生成自带（C 链，`talk_mode` 不再可选）；这一行只在通道形态相容时
  # 作为"换供应商"的覆盖存在（`core/talkmode.py` 是唯一映射表，路由不否决形态）。
  # 兜底 = fal.ai InfiniteTalk 图像端点（需 .env 的 FAL_KEY；2026-10-11 实测该账号 403
  # 「余额耗尽」，未填 KEY 时兜底为空 → 走降级并落 degradations.json，看板红标）。
  talk: {default: dashscope_wan22_s2v, fallback: fal_infinitalk}
  i2v: {default: dashscope_wan27_i2v}   # 与 480P 同族，只差分辨率档
  # **本档不再自己写文生图路由与模型**（2026-10-17 定）：text2image 只有一份出厂值
  # （configs/default.yaml 的 providers.t2i + models.dashscope_t2i27），而且新建任务时
  # 「模型选择」里点的名压过一切 —— 见 core/config.py:apply_run_overrides（唯一恢复入口）。
  # 各档写一份的坏处实测过：路由早已三档相同，models 却各写各的，于是面板"默认 X"显示的
  # 模型与这条 run 真正会调用的模型成了两个东西（显示 wanx2.1-t2i-*，实际 wan2.7-image）。

generation:
  # 成片尺寸不写在这里：唯一来源是 core/config.py 的 RESOLUTION_SIZES（分辨率×画幅）。
  # 两处都写就会出现「面板显示 720P、实际按 1080P 出片」（这条 bug 修过一次）。
  # 实发档位与面板选的分辨率**必须同名**：这一位由 `apply_resolution` 按分辨率落定，
  # 这里写的值只是给读 yaml 的人看的注释性事实（曾经写着 1080P，于是"面板 720P、注释说
  # 1080P"，而 720P 与 1080P 单价差一倍 —— 注释也是会被当判据读的东西）。
  i2v_resolution: 720P
  use_reference_keyframes: true   # 硬锁脸：首帧带角色立绘参考图
  require_reference_keyframes: true  # 强制：t2i 不支持参考图就在花钱前报错（一致性是交付承诺）
  consistency_gate: reshoot       # 成片前度量不达标 → 自动带参考图重做（≤2 轮）
  scene_ref_mode: scenery_only    # 场景图只喂空镜；all 需 m9 证明人脸不降才允许
  keyframe_seed_scope: cast       # 同角色跨场景同种子（旧 scene_cast 会换场景即换脸）
  asset_style_gate: warn          # 立绘若被判动漫/3D → 事件+降级台账（不阻断交付）
  look_extraction: true           # 结构化外貌卡：蒸馏校验与一致性度量的属性来源
  consistency_metric: sample      # 抽样度量（全检留给 1080P），产出 consistency_report.json
  # 全局风格锚：所有文生图（角色立绘/场景/分镜首帧）统一追加，杜绝"一格动漫一格真人"。
  # 中英双语文本：万相对英文摄影术语更敏感，显著压低 3D/皮克斯风漏网率
  style_suffix: >-
    真人写实电影剧照，院线级画质，自然皮肤纹理，电影级三点布光，
    柔和胶片颗粒，浅景深，高动态范围，色彩科学参考ARRI Alexa，
    photorealistic live-action film still, shot on 35mm lens, realistic human skin,
    natural color grading, no animation, no CGI look
  # 负向提示词：风格统一与劣化防御的硬约束
  negative_prompt: >-
    卡通，动漫，二次元，插画，手绘，3D渲染，CG感，塑料感，蜡像感，皮克斯风格，Q版，
    低质量，模糊，畸形，多余手指，脸部崩坏，字幕，水印，logo，过曝，
    cartoon, anime, 3d render, pixar style, disney style, illustration, painting
  color_grade: true
  loudnorm: true
  encode_crf: 20
  encode_preset: veryfast
  bgm_volume: 0.12

models:
  # 文生图不写在这里（三档同一个出厂模型 wan2.7-image，唯一来源 default.yaml + 前端选择）
  dashscope_i2v: wan3.0-video           # 场景级生成自带口型；本档实发 720P
