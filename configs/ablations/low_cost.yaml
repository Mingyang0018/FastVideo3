# 教学消融配置：低成本模式（关闭口型，对话镜头走 I2V+音频直叠）
# 用法：复制为 configs/active.yaml 或在命令行指定
providers:
  text: {default: dashscope_qwen, fallback: deepseek}
  # 基础档（480P）现在承诺「参考图锁脸」并带 require 门控：本臂若还写着收不了
  # 参考图的 wanx2.1 端点，m3 会在花钱**之前**直接报错（这是门控该有的行为）。
  # 本臂比的从来不是锁脸，所以跟着基础档走，不在这里另立一份一致性口径。
  t2i: {default: dashscope_wan27_image, fallback: dashscope_t2i}
  i2v: {default: dashscope_wan22_i2v, fallback: siliconflow_wan22}
  talk: {default: dashscope_wan22_s2v, fallback: kling_lipsync}
  tts: {default: edge_tts, fallback: dashscope_cosyvoice}
  vlm: {default: dashscope_vlm}

generation:
  aspect_ratio: "9:16"
  shot_duration_sec: 5
  talk_mode: audio_overlay      # ← 与 default 唯一差异：对话镜头不做口型
  resolution: [540, 960]
  storyboard_sample_rate: 0.3
  max_script_revisions: 1

limits:
  max_parallel_jobs: 4
  per_provider_concurrency: {dashscope: 3}
  i2v_poll_timeout_min: 30
  retry_per_shot: 1
